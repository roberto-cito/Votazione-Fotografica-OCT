spring.application.name=Votazione-Fotografica
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
server.port=80

# Forwarded Headers Configuration
server.forward-headers-strategy=framework
server.servlet.context-path=/votazione-fotografica
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=JSESSIONID_VOTAZIONEFOTOGRAFICA
server.servlet.session.cookie.same-site=lax
maintenance.password=${MAINTENANCE_PASSWORD:testingNow}

# Spring Boot Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true