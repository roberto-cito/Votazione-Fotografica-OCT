<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/ico" th:href="@{/photo/logo.png}">
    <title>Votazione Fotografica - Voto Confermato</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #3b82f6, #9333ea);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #fff;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(270deg, #06b6d4, #9333ea, #06b6d4);
            background-size: 600% 600%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease infinite;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .btn-home {
            background: linear-gradient(to right, #06b6d4, #6366f1);
            border: none;
            color: white;
            font-size: 1rem;
            padding: 0.75rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-home:hover {
            background: linear-gradient(to right, #0891b2, #4f46e5);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #f0f0f0;
            z-index: 1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background-color: #4cc9f0;
        }

        @media screen and (max-width: 600px) {
            h1 {
                font-size: 2rem;
                padding: 0 1rem;
            }

            p {
                font-size: 1rem;
                padding: 0 1rem;
            }

            .btn-home {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<h1>Voto Registrato!</h1>
<p>Grazie per aver partecipato alla votazione fotografica. Il tuo voto è stato salvato con successo!</p>

<form th:action="@{/logout}" method="post" style="margin: 0; padding: 0;">
    <button type="submit" class="btn-home" style="font-family: inherit;">
        <i class="fas"></i> Fai il logout
    </button>
</form>
<footer style="text-align: center; margin-top: 20px; font-size: 0.9em; color: #555;">Made with ❤️ by <a href="https://github.com/roberto-cito">Cito Roberto</a>     
   V3.0</footer>

<div id="particles-js" class="particles-container"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof particlesJS !== 'undefined') {
            particlesJS("particles-js", {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#ffffff",
                        opacity: 0.4,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "grab" },
                        onclick: { enable: true, mode: "push" }
                    },
                    modes: {
                        grab: { distance: 140, line_linked: { opacity: 1 } },
                        push: { particles_nb: 4 }
                    }
                }
            });
        }
    });
</script>

</body>
</html>
