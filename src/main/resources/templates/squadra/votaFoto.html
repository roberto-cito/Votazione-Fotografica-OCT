<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Votazione Fotografica - Vota Foto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #3b82f6, #9333ea);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: #333;
            overflow-x: hidden;
        }

        h2 {
            color: #fff;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(270deg, #06b6d4, #9333ea, #06b6d4);
            background-size: 600% 600%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease infinite;
            text-align: center;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
            z-index: 1;
        }

        .photo-card {
            background: #f9f9f9;
            border-radius: 16px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .photo-card:hover {
            transform: scale(1.03);
        }

        .photo-card img {
            width: 100%;
            height: 150px; /* Altezza fissa */
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            display: block;
            cursor: pointer;
        }

        /* --- STILE PULSANTE ZOOM --- */
        .btn-zoom {
            background-color: transparent;
            border: 2px solid #6366f1;
            color: #6366f1;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-zoom:hover {
            background-color: #6366f1;
            color: white;
        }

        .vote-radio {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #eee;
            width: 100%;
        }

        .btn-vote {
            margin-top: 2rem;
            background: linear-gradient(to right, #06b6d4, #6366f1);
            border: none;
            color: white;
            font-size: 1rem;
            padding: 0.75rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: background 0.3s ease;
        }

        .btn-vote:hover {
            background: linear-gradient(to right, #0891b2, #4f46e5);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #f0f0f0;
            z-index: 1;
        }

        /* --- STILE MODAL (POPUP) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            animation: zoom 0.3s;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

        @keyframes zoom {
            from {transform:scale(0)}
            to {transform:scale(1)}
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background-color: #4cc9f0;
        }

        /* Responsive migliorato */
        @media screen and (max-width: 700px) {
            .photo-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .photo-card {
                padding: 0.75rem;
            }

            .photo-card img {
                height: 200px;
            }

            h2 {
                font-size: 1.5rem;
                padding: 0 1rem;
            }

            .btn-vote {
                width: 100%;
                padding: 0.75rem;
                font-size: 1.1rem;
            }
        }

        /* --- STILE ALERT --- */
        .alert {
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            z-index: 1;
            text-align: center;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<h2>Seleziona la foto che vuoi votare:</h2>

<div th:if="${param.errorSelf}" class="alert alert-danger">
    <i class="fas fa-exclamation-triangle"></i> Non puoi votare la tua stessa foto!
</div>
<div th:if="${param.errorIstituto}" class="alert alert-danger">
    <i class="fas fa-exclamation-triangle"></i> Non puoi votare una squadra del tuo stesso istituto!
</div>

<form th:action="@{/ConfermaVoto}" method="post">
    <div class="photo-grid">
        <div class="photo-card" th:each="s : ${squadre}">
            <img th:src="${s.path_foto}"
                 th:data-url="${s.path_foto}"
                 onclick="openModal(this.getAttribute('data-url'))"
                 alt="Foto Squadra">

            <button type="button" class="btn-zoom"
                    th:data-url="${s.path_foto}"
                    onclick="openModal(this.getAttribute('data-url'))">
                <i class="fas fa-search-plus"></i> Ingrandisci
            </button>

            <div class="vote-radio">
                <input type="radio" name="fotoSelezionata" th:value="${s.squadra}" required> Seleziona
            </div>
        </div>
    </div>

    <button type="submit" class="btn-vote">
        <i class="fas fa-vote-yea"></i> Conferma Voto
    </button>
</form>
<footer style="text-align: center; margin-top: 20px; font-size: 0.9em; color: #555;">Made with ❤️ by <a href="https://github.com/RMChannel">Cito Roberto</a>     
   V3.0</footer>

<div id="particles-js" class="particles-container"></div>

<div id="myModal" class="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img class="modal-content" id="img01">
</div>

<script>
    // Funzioni per la Modal
    function openModal(src) {
        var modal = document.getElementById("myModal");
        var modalImg = document.getElementById("img01");
        modal.style.display = "block";
        modalImg.src = src;
    }

    function closeModal() {
        var modal = document.getElementById("myModal");
        modal.style.display = "none";
    }

    // Configurazione Particles
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof particlesJS !== 'undefined') {
            particlesJS("particles-js", {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#ffffff",
                        opacity: 0.4,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "grab" },
                        onclick: { enable: true, mode: "push" }
                    },
                    modes: {
                        grab: { distance: 140, line_linked: { opacity: 1 } },
                        push: { particles_nb: 4 }
                    }
                }
            });
        }
    });
</script>

</body>
</html>
