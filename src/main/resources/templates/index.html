<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<html lang="it">
<head>
    <base href="/votazione-fotografica/">
    <meta charset="UTF-8">
    <link rel="icon" type="image/ico" th:href="@{/photo/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Votazione Fotografia - Home</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" th:href="@{/votazionefotografica/css/wallPaper.css}">
    <link rel="stylesheet" th:href="@{/votazionefotografica/css/responsive.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #3b82f6, #9333ea);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .login-container {
            background: #f9f9f9;
            border-radius: 20px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .login-container h2 {
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
        }

        .password-toggle-btn img {
            width: 20px;
            height: 20px;
        }

        .btn-login {
            background: linear-gradient(to right, #06b6d4, #6366f1);
            border: none;
            color: white;
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background 0.3s ease;
        }

        .btn-login:hover {
            background: linear-gradient(to right, #0891b2, #4f46e5);
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background-color: #4cc9f0;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Login Squadra</h2>
    <form id="loginForm" class="login-form" method="post" th:action="@{/login}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required placeholder="Inserisci username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
                <input type="password" id="password" name="password" class="form-control" required placeholder="Inserisci password">
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password')">
                    <img th:src="@{photo/hidden.png}" alt="Mostra Password" id="password-toggle-img">
                </button>
            </div>
        </div>
        <div th:if="${param.error}" style="color: red; margin-bottom: 1rem;">
            Username o password errati
        </div>
        <div th:if="${param.logout}" style="color: green; margin-bottom: 1rem;">
            Logout avvenuto con successo
        </div>

        <div class="form-group text-center">
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Accedi
            </button>
        </div>
    </form>
</div>

<div id="particles-js" class="particles-container"></div>
<footer style="text-align: center; margin-top: 20px; font-size: 0.9em; color: #555;">Made with ❤️ by <a href="https://github.com/roberto-cito">Cito Roberto</a>     
   V3.0</footer>

<script>
    function togglePasswordVisibility(id) {
        const input = document.getElementById(id);
        const img = document.getElementById('password-toggle-img');
        if (input.type === 'password') {
            input.type = 'text';
            img.src = '[[@{/photo/eye.png}]]';
        } else {
            input.type = 'password';
            img.src = '[[@{/photo/hidden.png}]]';
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        if (typeof particlesJS !== 'undefined') {
            particlesJS("particles-js", {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#ffffff",
                        opacity: 0.4,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "grab" },
                        onclick: { enable: true, mode: "push" }
                    },
                    modes: {
                        grab: { distance: 140, line_linked: { opacity: 1 } },
                        push: { particles_nb: 4 }
                    }
                }
            });
        }
    });
</script>
</body>
</html>
