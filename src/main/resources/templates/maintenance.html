<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/ico" th:href="@{/photo/logo.png}">
    <title>Site in Manutenzione</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .maintenance-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            max-width: 90%;
            width: 500px;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
        }

        .maintenance-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #4facfe;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #333;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #666;
        }

        .contact-info {
            font-size: 16px;
            color: #888;
            margin-top: 30px;
        }

        .contact-info a {
            color: #4facfe;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .maintenance-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="logo">
            <img src="https://i.imgur.com/yCa1M8b.png" alt="OCT Logo" style="max-width: 90px; max-height: 90px">
        </div>
        <div class="maintenance-icon">🔧</div>
        <h1>Sito in Manutenzione</h1>
        <p>Stiamo effettuando una manutenzione programmata per migliorare la tua esperienza. Torneremo online a breve.</p>
        <p>Grazie per la tua pazienza.</p>
        <div class="contact-info">
            Per richieste urgenti, contattare lo staff</a>
        </div>
        </div>
<footer style="text-align: center; margin-top: 20px; font-size: 0.9em; color: #555;">Made with ❤️ by <a href="https://github.com/roberto-cito">Cito Roberto</a>     
   V3.0</footer>
        </body>
        </html>
